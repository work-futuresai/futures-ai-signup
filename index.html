<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>揭密主力籌碼</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .animate-scan { animation: scan 2s linear infinite; }
        .break-keep { word-break: keep-all; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #05070a; }
        ::-webkit-scrollbar-thumb { background: #22d3ee30; border-radius: 10px; }
        #debug-box { display: none; background: white; color: red; padding: 10px; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; }
        #neuronCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.8; }
        select { -webkit-appearance: none; appearance: none; }
        .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#05070a] text-gray-100 font-sans antialiased">
    <canvas id="neuronCanvas"></canvas>
    <div id="debug-box"></div>
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState } = React;

        // ✅ 版號
        const VERSION = "v28.27";

        // ✅ 正式部署網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwJSSJYT2U1awmqFlfFyDN4AYcF7j3DBbqOkhed2khhpmSzxy3GrTy8Bw62x2t7vZCW/exec";

        const UI_OPTIONS = {
            tradeCount: [
                { val: "trade_1", label: "是的，我於任一券商近半年期權月均交易口數達 10 口以上" },
                { val: "trade_2", label: "目前尚未達 10 口以上，但對金融科技有強烈學習熱誠" }
            ],
            interests: [
                { val: "int_1", label: "機器學習特徵提取邏輯" },
                { val: "int_2", label: "多空動能趨式雷達應用" },
                { val: "int_3", label: "斜率與過濾盤整盤方法" },
                { val: "int_4", label: "低延遲數據資料視覺化" },
                { val: "int_other", label: "其他 (請於下方填寫)" }
            ],
            computer: [
                { val: "comp_1", label: "會" },
                { val: "comp_2", label: "不會" }
            ],
            area: [
                { val: "area_n", label: "北部區域" },
                { val: "area_c", label: "中部區域" },
                { val: "area_s", label: "南部區域" },
                { val: "area_e", label: "東部區域" },
                { val: "area_o", label: "離島" }
            ],
            age: [
                { val: "age_1", label: "20以下" },
                { val: "age_2", label: "20~35" },
                { val: "age_3", label: "35~50" },
                { val: "age_4", label: "50~65" },
                { val: "age_5", label: "65以上" }
            ]
        };

        const Icon = ({ path, color = "currentColor", size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );

        const Icons = {
            Cpu: (props) => <Icon {...props} path={<><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></>} />,
            Activity: (props) => <Icon {...props} path={<polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />} />,
            User: (props) => <Icon {...props} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
            Mic: (props) => <Icon {...props} path={<><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></>} />,
            Book: (props) => <Icon {...props} path={<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>} />,
            CheckCircle: (props) => <Icon {...props} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
            PlayCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></>} />,
            Shield: (props) => <Icon {...props} path={<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />} />,
            Laptop: (props) => <Icon {...props} path={<><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="2" y1="20" x2="22" y2="20"/></>} />
        };

        const App = () => {
            const [status, setStatus] = useState("idle");
            const [errorMsg, setErrorMsg] = useState("");
            const [formData, setFormData] = useState({
                name: "", phone: "", line: "", email: "", area: "", age: "", software: "",
                tradeCount: "", interests: [], interestOtherText: "", computer: "", agree: ""
            });

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });
            
            const handleInterestChange = (val) => {
                setFormData(prev => {
                    const newInterests = prev.interests.includes(val) 
                        ? prev.interests.filter(i => i !== val) 
                        : [...prev.interests, val];
                    return { ...prev, interests: newInterests };
                });
            };

            const handleAgreeChange = (e) => setFormData({ ...formData, agree: e.target.checked ? "agree_1" : "" });

            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus("submitting");
                setErrorMsg("");

                if (!formData.name || !formData.phone || !formData.line || !formData.email || !formData.area || !formData.age || !formData.software) {
                    setStatus("error"); setErrorMsg("請填寫完整基本資料 (包含年齡與 Email)"); window.scrollTo(0, 0); return;
                }
                if (!formData.tradeCount || formData.interests.length === 0 || !formData.computer || !formData.agree) {
                    setStatus("error"); setErrorMsg("請完成下方勾選項目"); return;
                }
                if (formData.interests.includes("int_other") && !formData.interestOtherText.trim()) {
                    setStatus("error"); setErrorMsg("請輸入「其他」感興趣的主題內容"); return;
                }

                fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(formData)
                })
                .then(response => response.json())
                .then(res => {
                    if (res.success) setStatus("success");
                    else { setStatus("error"); setErrorMsg(res.msg); }
                })
                .catch(err => {
                    setStatus("error");
                    setErrorMsg("連線失敗：" + err.toString());
                });
            };

            const handleImageError = (e) => {
                e.currentTarget.onerror = null; 
                e.currentTarget.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=http://youtube.com/@FuturesAI_Live?sub_confirmation=1';
            };

            if (status === "success") {
                return (
                    <div className="min-h-screen bg-transparent text-white flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-[#0d1117]/90 border-2 border-cyan-400 rounded-3xl p-10 text-center shadow-[0_0_50px_rgba(6,182,212,0.4)] animate-fade-in backdrop-blur-sm">
                            <Icons.CheckCircle size={80} color="#22d3ee" className="mx-auto mb-6" />
                            <h2 className="text-3xl font-black mb-4 uppercase tracking-wider">報名傳輸完成</h2>
                            <p className="text-gray-200 mb-10 text-lg">數據席位已保留，請留意後續聯絡訊息。</p>
                            <button onClick={() => window.location.reload()} className="w-full py-5 bg-cyan-500 text-black text-xl font-black rounded-2xl shadow-lg transition-transform active:scale-95 hover:bg-cyan-400">
                                返回首頁
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24 overflow-x-hidden selection:bg-cyan-500/30 text-left">
                    <div className="relative z-10 max-w-4xl mx-auto px-4 pt-6 text-left">      

                        <header className="relative mb-8 rounded-3xl overflow-hidden border-2 border-cyan-500/50 bg-[#0d1117]/80 shadow-xl backdrop-blur-sm p-6 md:p-12 text-left">

                          <div className="flex items-center justify-between text-cyan-400 font-black text-[10px] md:text-xs mb-5 tracking-[0.2em] md:tracking-[0.3em] uppercase">
                            <div className="flex items-center gap-2">
                              <div className="w-2 h-2 bg-cyan-500 animate-pulse rounded-full shadow-[0_0_8px_#22d3ee]"></div>
                              Collaboration / 證券期貨籌碼揭密分享
                            </div>
                            <span className="font-mono text-cyan-500/60">{VERSION}</span>
                          </div>

                          <h1 className="text-3xl md:text-6xl font-black text-white mb-6 leading-tight tracking-tighter break-keep">
                            掀開籌碼真相！
                          </h1>

                          <div className="space-y-8 mb-8 text-left">
                            <div className="flex items-start gap-3 md:gap-4">
                              <div className="mt-1.5 p-1.5 md:p-2 bg-cyan-500/20 rounded-lg shrink-0 border border-cyan-500/30">
                                <Icons.Cpu size={24} color="#22d3ee" className="md:w-7 md:h-7" />
                              </div>

                              <div className="space-y-4 overflow-hidden w-full">
                                
                                <p className="text-[4.8vw] md:text-xl text-white font-black leading-relaxed italic">
                                  <span className="md:inline">
                                    別讓你的看盤技術輸給了市場，
                                    <span className="text-cyan-400 underline decoration-2 md:decoration-4 underline-offset-4 md:underline-offset-8">
                                      揭開 K線看不清的籌碼真相！
                                    </span>
                                  </span>
                                </p>
                                <div className="bg-white/5 border-l-2 border-cyan-500/50 p-4 rounded-r-xl my-6 space-y-3 shadow-[0_0_15px_rgba(0,0,0,0.3)]">
                                  <p className="text-xs md:text-base text-gray-300 flex items-center gap-2 font-bold">
                                    <span className="text-xs md:text-sm">🥊</span> 還在盯K棒猜主力意圖？
                                  </p>
                                  <p className="text-xs md:text-base text-gray-300 flex items-center gap-2 font-bold">
                                    <span className="text-xs md:text-sm">🥊</span> 看盤工具無法看清動能？
                                  </p>
                                  <p className="text-xs md:text-base text-gray-300 flex items-center gap-2 font-bold">
                                    <span className="text-xs md:text-sm">🥊</span> 還在為寫程式熬夜除錯？
                                  </p>
                                </div>
                                <div className="mb-12 pl-4 md:pl-6 border-l border-dashed border-gray-600/50">
                                  <p className="text-xl md:text-3xl text-cyan-400 font-black italic tracking-wider leading-snug drop-shadow-md mb-8">
                                    「人生就像走勢圖！<br class="md:hidden" />別讓情緒模糊了視野！」
                                  </p>
                                  
                                  {/* ✅ 修正處：這裡恢復為原本的價值主張說明 */}
                                  <div className="mb-8">
                                    <p className="text-base md:text-lg text-gray-300 leading-relaxed font-medium italic pl-1">
                                      分享會 <span className="text-red-400 font-extrabold not-italic">不談預測</span>，
                                      而是帶您看案例中的特徵是如何優化決策流程，輔助您拼上這最後一塊科技看盤拼圖，
                                      <span className="text-cyan-400 underline decoration-2 md:decoration-4 underline-offset-4 md:underline-offset-8">
                                        抓出期貨落後的關鍵！
                                      </span>
                                    </p>
                                  </div>
                                </div>

                                <div className="flex items-center gap-3 mb-6 mt-10">
                                    <div className="h-px w-8 bg-cyan-500 shadow-[0_0_5px_#22d3ee]"></div>
                                    <span className="text-[10px] md:text-xs text-cyan-400 font-black tracking-[0.2em] uppercase border border-cyan-500/30 px-2 py-1 rounded bg-cyan-950/50 backdrop-blur-sm">
                                        SPEAKER  / 講者介紹
                                    </span>
                                    <div className="h-px flex-grow bg-gradient-to-r from-cyan-500/50 to-transparent"></div>
                                </div>

                                <p className="text-lg md:text-lg text-gray-400 leading-relaxed font-medium italic pl-1">
                                  我是 <span className="text-white font-black text-lg not-italic">楊恭臨</span>，一位專注於金融科技與量化交易的創作者。
                                  帶您認識量能特徵建立的客觀風控思維，我相信
                                  <span className="text-cyan-400 italic font-bold">
                                    透過不同的看盤方法能有效追蹤行情變化及強化交易風控能力。
                                  </span>
                                </p>

                                <div className="mt-10 p-6 md:p-10 bg-gradient-to-br from-cyan-950/40 to-black/60 border border-cyan-500/30 rounded-3xl shadow-[0_0_30px_rgba(34,211,238,0.1)]">
                                  <div className="mb-6 flex items-center gap-2 text-cyan-400 text-[10px] md:text-xs font-black tracking-[0.2em] uppercase">
                                    <Icons.Activity size={16} /> Mission / 任務核心
                                  </div>
                                  <div className="space-y-8 text-left">
                                      <h4 className="text-2xl md:text-4xl text-white font-black leading-tight italic">
                                        最後一哩路：
                                        <div className="mt-4 flex flex-wrap items-center gap-3 text-left italic">
                                          <span className="text-gray-500 text-lg md:text-2xl font-bold">從</span>
                                          <span className="px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg italic animate-pulse text-xl md:text-3xl font-black">
                                            「憑感覺」
                                          </span>
                                          <span className="text-gray-500 text-lg md:text-2xl font-bold">進化到</span>
                                          <span className="px-3 py-1 bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded-lg italic shadow-[0_0_15px_rgba(34,211,238,0.4)] text-xl md:text-3xl font-black">
                                            「看證據」
                                          </span>
                                        </div>
                                      </h4>
                                      <p className="text-white text-lg md:text-lg text-gray-400 leading-relaxed font-medium italic">
                                        您的交易心法是核心，
                                        <span className="text-cyan-400 italic font-bold">
                                          搭配您個人所學建立穩健交易體系！
                                        </span>
                                      </p>
                                  </div>
                                </div>

                                <div className="mt-10 p-6 md:p-10 bg-[#0d1117]/60 border border-gray-700/50 rounded-3xl relative overflow-hidden group hover:border-cyan-500/30 transition-all duration-500">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 blur-[50px] rounded-full pointer-events-none animate-pulse"></div>
                                    <div className="mb-6 flex items-center gap-2 text-cyan-400 text-[10px] md:text-xs font-black tracking-[0.2em] uppercase">
                                        <Icons.Cpu size={16} /> Strategy / 策略戰場
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="p-5 rounded-2xl bg-gradient-to-br from-cyan-950/30 to-black border border-cyan-500/20 shadow-[0_0_15px_rgba(34,211,238,0.05)]">
                                            <div className="flex items-center gap-3 mb-3">
                                                <span className="px-2 py-1 text-sm font-black bg-cyan-500 text-black rounded uppercase tracking-wider">
                                                    早盤 / 
                                                </span>
                                                <div className="h-px flex-grow bg-cyan-500/30"></div>
                                            </div>
                                            <p className="text-gray-300 font-bold text-sm md:text-xl leading-relaxed">
                                                輔助 <span className="text-white border-b-2 border-cyan-500 pb-0.5">台股</span> 及 <span className="text-white border-b-2 border-cyan-500 pb-0.5">台指</span>
                                            </p>
                                            <p className="text-xs text-cyan-400/60 mt-2 font-mono tracking-widest">TWSE / TXF1</p>
                                        </div>
                                        <div className="p-5 rounded-2xl bg-gradient-to-br from-purple-950/30 to-black border border-purple-500/20 shadow-[0_0_15px_rgba(168,85,247,0.05)]">
                                            <div className="flex items-center gap-3 mb-3">
                                                <span className="px-2 py-1 text-sm font-black bg-purple-500 text-black rounded uppercase tracking-wider">
                                                    夜盤 / 
                                                </span>
                                                <div className="h-px flex-grow bg-purple-500/30"></div>
                                            </div>
                                            <p className="text-gray-300 font-bold text-sm md:text-xl leading-relaxed">
                                                輔助 <span className="text-white">微/小 那</span>、
                                                <br className="md:hidden" />
                                                <span className="text-white whitespace-nowrap">美股及台指</span>
                                            </p>
                                            <p className="text-xs text-purple-400/60 mt-2 font-mono tracking-widest">NASDAQ / MICRO FUTURES</p>
                                        </div>
                                    </div>
                                </div>

                              </div>
                            </div>
                          </div>
                        </header>

                        <section className="mb-10 group text-left">
                            <div className="bg-gradient-to-r from-[#0d1117]/90 via-[#161b22]/90 to-[#0d1117]/90 border-2 border-cyan-500/50 rounded-3xl overflow-hidden shadow-2xl transition-all hover:border-cyan-400 backdrop-blur-sm">
                                <div className="flex flex-col md:flex-row items-center">
                                    <div className="w-full md:w-1/3 p-8 flex flex-col items-center justify-center bg-black/40 border-b md:border-b-0 md:border-r border-white/10 relative overflow-hidden text-center">
                                        <div className="relative group/qr cursor-pointer">
                                            <div className="absolute -top-2 -left-2 w-4 h-4 border-t-2 border-l-2 border-cyan-400"></div>
                                            <div className="absolute -top-2 -right-2 w-4 h-4 border-t-2 border-r-2 border-cyan-400"></div>
                                            <div className="absolute -bottom-2 -left-2 w-4 h-4 border-b-2 border-l-2 border-cyan-400"></div>
                                            <div className="absolute -bottom-2 -right-2 w-4 h-4 border-b-2 border-r-2 border-cyan-400"></div>
                                            <div className="absolute top-0 left-0 w-full h-1 bg-cyan-400/50 shadow-[0_0_10px_#22d3ee] animate-scan z-10 pointer-events-none"></div>
                                            <img src="期貨戰情室Qrcode_.png" alt="QR Code" className="w-32 h-32 md:w-40 md:h-40 grayscale group-hover/qr:grayscale-0 transition-all duration-500 rounded-lg shadow-2xl" onError={handleImageError} />
                                        </div>
                                        <div className="mt-4 flex items-center gap-2 text-cyan-400 font-black text-[10px] tracking-widest uppercase text-center"><Icons.Activity size={12} color="#22d3ee" className="animate-pulse" /> Live System Scan</div>
                                    </div>
                                    <div className="w-full md:w-2/3 p-6 md:p-10 text-left">
                                        <h3 className="text-2xl md:text-3xl font-black text-white mb-8 leading-snug break-keep italic">
                                            解鎖數據視野：
                                            <br className="md:hidden" />
                                            <span className="inline-flex items-center gap-2 mt-3 md:mt-2 px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-950/50 to-transparent border border-cyan-500/40 shadow-[0_0_20px_rgba(34,211,238,0.25)] backdrop-blur-md transform hover:scale-[1.02] transition-all duration-300 cursor-default group">
                                            <Icons.Activity size={24} className="text-cyan-400 animate-pulse shrink-0 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]" />

                                            </span>
                                            </span>

                        <form onSubmit={handleSubmit} className="space-y-8 text-left animate-fade-in" style={{animationDelay: '0.2s'}}>

                                <div className="flex items-center gap-3 mb-8 border-b border-cyan-500/20 pb-5 uppercase">

                            <div className="space-y-8 mt-12 text-left animate-fade-in" style={{animationDelay: '0.4s'}}>

    <script>
        const canvas = document.getElementById('neuronCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particlesArray;
        const numberOfParticles = (canvas.width * canvas.height) / 9000;
        const connectionDistance = 160;
        const particleSpeed = 1.5;
        let mouse = { x: null, y: null, radius: 150 }
        window.addEventListener('mousemove', function(event) { mouse.x = event.x; mouse.y = event.y; });
        class Particle {
            constructor(x, y, dx, dy, size, color) {
                this.x = x; this.y = y; this.dx = dx; this.dy = dy; this.size = size; this.color = color;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color; ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.dx = -this.dx;
                if (this.y > canvas.height || this.y < 0) this.dy = -this.dy;
                let d = Math.sqrt((mouse.x - this.x)**2 + (mouse.y - this.y)**2);
                if (d < mouse.radius) { if (this.size < 5) this.size += 1; }
                else if (this.size > 2) { this.size -= 1; }
                this.x += this.dx; this.y += this.dy; this.draw();
            }
        }
        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 3) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                particlesArray.push(new Particle(x, y, (Math.random()-0.5)*particleSpeed, (Math.random()-0.5)*particleSpeed, size, Math.random() > 0.1 ? '#22d3ee' : '#ef4444'));
            }
        }
        function connect() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let d = ((particlesArray[a].x - particlesArray[b].x)**2) + ((particlesArray[a].y - particlesArray[b].y)**2);
                    if (d < connectionDistance**2) {
                        ctx.strokeStyle = `rgba(34, 211, 238, ${1 - d/connectionDistance**2})`;
                        ctx.lineWidth = 1; ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }
        function animate() {
            requestAnimationFrame(animate); ctx.clearRect(0, 0, innerWidth, innerHeight);
            particlesArray.forEach(p => p.update()); connect();
        }
        window.addEventListener('resize', () => { canvas.width=innerWidth; canvas.height=innerHeight; init(); });
        init(); animate();
    </script>
